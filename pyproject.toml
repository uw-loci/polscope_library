[project]
name = "polscope-library"
version = "0.1.0"
description = "Birefringence reconstruction for LC-PolScope microscopes (numpy only, no phase)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Mike Nelson", email = "msnelson8@wisc.edu"}
]
keywords = ["polscope", "lc-polscope", "polarization", "birefringence", "qlipp", "microscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Deliberately minimal. The reason this package exists rather than depending on
# waveorder is that the birefringence path needs nothing more than numpy --
# PyTorch and Python >= 3.12 are requirements of the phase reconstruction we do
# not use.
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Only the calibration search needs an optimiser; the reconstruction path is
# imported per tile during acquisition and stays numpy-only.
calib = [
    "scipy>=1.11.0",
]
# Only the scheme_check diagnostic reads image files; the reconstruction
# path takes arrays, so this stays out of the core dependency set.
io = [
    "tifffile>=2023.1.0",
]
dev = [
    "scipy>=1.11.0",
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
polscope-scheme-check = "polscope_library.scheme_check:main"

[project.urls]
Homepage = "https://github.com/uw-loci/polscope_library"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Keep the editable install a plain sys.path entry (the project root), not
# setuptools' import-hook "finder". Under the finder, any folder named
# polscope_library on sys.path that has no __init__.py -- this repo's own
# root, whenever Python starts in the folder that holds the checkouts -- is
# claimed as a namespace package before the finder runs, and every
# `from polscope_library import ...` then fails with "(unknown location)".
# That took the LC-PolScope rig down on 2026-10-12. Removing this line
# brings the finder back; `where = ["."]` alone does not help.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["polscope_library*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Explicit rather than inherited: without this, a new ruff release that turns
# on a rule breaks CI on a day nobody touched the code.
select = ["E", "F", "W", "I", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
