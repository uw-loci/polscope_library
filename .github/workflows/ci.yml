name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor we claim, and claiming it is the whole point of the
        # numpy port -- waveorder needs 3.12+. If 3.10 ever breaks here, the
        # justification for this package weakens, so it is tested first.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check polscope_library tests
          black --line-length 120 --check polscope_library tests
      - name: Test
        run: pytest -q
